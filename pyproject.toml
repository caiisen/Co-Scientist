[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist"
version = "0.1.0"
description = "A third-party Co-Scientist reproduction scaffold."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Co-Scientist Reproduction Contributors" }
]
dependencies = [
  "aiohttp>=3.9",
  "aiosqlite>=0.19",
  "biopython>=1.83",
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "rich>=13.7",
  "tavily-python>=0.3",
  "tenacity>=8.3",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
co-scientist = "co_scientist.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
