runtime:
  initial_ideas: 5
  max_ideas: 20
  max_matches_per_idea: 5
  worker_concurrency: 4
  request_timeout_seconds: 60
  elo_stagnation_threshold: 5.0
  elo_stagnation_window: 4

search:
  tavily_enabled: true
  pubmed_enabled: true
  semantic_scholar_enabled: true
  arxiv_enabled: true
  max_results: 5
  cache_ttl_seconds: 604800
  failed_cache_ttl_seconds: 300
  tavily_api_key_env: TAVILY_API_KEY
  ncbi_api_key_env: NCBI_API_KEY
  ncbi_email_env: NCBI_EMAIL
  semantic_scholar_api_key_env: SEMANTIC_SCHOLAR_API_KEY
  tavily_max_results: 5
  pubmed_max_results: 5
  semantic_scholar_max_results: 5
  arxiv_max_results: 5
  openalex_enabled: true
  private_corpus_enabled: false
  private_corpus_paths: []
  private_corpus_max_results: 3
  private_corpus_chunk_chars: 1600
  private_corpus_chunk_overlap: 200

observability:
  metrics_enabled: true
  runs_dir: runs

llm:
  default_provider: openai
  providers:
    openai:
      api_key_env: OPENAI_API_KEY
      base_url_env: OPENAI_BASE_URL
      base_url: https://api.openai.com/v1
      chat_model: gpt-4o-mini
      embedding_model: text-embedding-3-small
      temperature: 0.4
      max_tokens: 4096
    deepseek:
      api_key_env: DEEPSEEK_API_KEY
      base_url_env: DEEPSEEK_BASE_URL
      base_url: https://api.deepseek.com
      chat_model: deepseek-chat
      embedding_model: text-embedding-3-small
      temperature: 0.4
      max_tokens: 4096
    qwen:
      api_key_env: QWEN_API_KEY
      base_url_env: QWEN_BASE_URL
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat_model: qwen-plus
      embedding_model: text-embedding-v3
      temperature: 0.4
      max_tokens: 4096
    kimi:
      api_key_env: KIMI_API_KEY
      base_url_env: KIMI_BASE_URL
      base_url: https://api.moonshot.cn/v1
      chat_model: moonshot-v1-32k
      embedding_model: text-embedding-3-small
      temperature: 0.4
      max_tokens: 4096
  agents: {}
